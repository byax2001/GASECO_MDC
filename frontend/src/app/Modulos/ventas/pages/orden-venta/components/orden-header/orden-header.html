<!-- SE COLOCA ASI EL FORMHEADER POR QUE ESTA SIENDO INYECTADO DESDE EL COMPONENTE 
 PADRE ORDEN-VENTA, SI SE COLOCA COMO formHeader SIN LOS PARENTESIS, 
 SE CREA UN NUEVO FORMULARIO VACIO Y NO SE MUESTRA LA INFORMACION CORRECTAMENTE -->
<div [formGroup]="formHeader()">
  <div class="w-full  p-1 bg-white">
    <!-- HEADER FORM -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 md:mb-10">

      <div class="p-3 rounded-xl bg-gray-50">
        <label class="text-xs text-gray-500">Cliente</label>
        <p class="font-semibold text-gray-800">
          {{ CustInfoOv().Customer_Name }}
        </p>
      </div>

      <div class="p-3 rounded-xl bg-gray-50">
        <label class="text-xs text-gray-500">Código Cliente</label>
        <p class="font-semibold text-gray-800">
          {{ CustInfoOv().Customer_CustID }}
        </p>
      </div>

      <div class="p-3 rounded-xl bg-gray-50">
        <label class="text-xs text-gray-500">Vendedor</label>
        <p class="font-semibold text-gray-800">
          {{ CustInfoOv().SalesRep_Name }}
        </p>
      </div>

      <div class="p-3 rounded-xl bg-gray-50">
        <label class="text-xs text-gray-500">Condición de Pago</label>
        <p class="font-semibold text-gray-800">
          {{ CustInfoOv().Terms_Description }}
        </p>
      </div>

      <div class="p-3 rounded-xl bg-gray-50">
        <label class="text-xs text-gray-500">Tipo de Cilindros</label>
        <select formControlName="TipoCilindros" class="select select-bordered w-full">
          @for(tcilindro of TipoCilindros(); track tcilindro) {
          <option [value]="tcilindro.code">
            {{ tcilindro.description }}
          </option>
          }
        </select>
      </div>

      

      <div class="p-3 rounded-xl bg-gray-50">
        <label class="text-xs text-gray-500">Descripción Moneda</label>
        <select formControlName="currencyCode" class="select select-bordered w-full">
          @for(moneda of LMonedas(); track moneda.RowIdent) {
          <option [value]="moneda.Currency_CurrencyCode">
            {{ moneda.Currency_CurrencyCode }}
          </option>
          }
        </select>
      </div>
      <div class="p-3 rounded-xl bg-gray-50">
        <label class="text-xs text-gray-500">Tipo de Operación</label>
        <select  formControlName="TipoOperacion" class="select select-bordered w-full text-xs">
          @for(tipo of TipoOperacion(); track tipo) {
          <option [value]="tipo.code">
            {{ tipo.description }}
          </option>
          }
        </select>
      </div>

      <div>
        <label class="label">
          <span class="label-text">Fecha requerida</span>
        </label>
        <input type="date" class="input input-bordered w-full" formControlName="fechaRequerida" />
      </div>

      <div>
        <label class="label">
          <span class="label-text">Orden de Compra</span>
        </label>
        <input type="text" placeholder="Ingrese orden de compra" class="input input-bordered w-full"
          formControlName="OC" />
      </div>
      <div>
        <label class="label">
          <span class="label-text">Ubicación</span>
        </label>
        <input type="text" placeholder="Ingrese ubicación" class="input input-bordered w-full"
          formControlName="ubicacion" />
      </div>
      <div>
        <label class="label">
          <span class="label-text">Proyecto</span>
        </label>
        <input type="text" placeholder="Ingrese proyecto" class="input input-bordered w-full"
          formControlName="proyecto" />
      </div>

      <div class="p-3 rounded-xl bg-gray-50">
        <label class="text-xs text-gray-500">Numero de Orden</label>
        <p class="font-semibold text-gray-800">
          @if(orderNumView() > 0) {
          {{ orderNumView() }}
          } @else {
          En Espera de creación
          }
        </p>
      </div>

    </div>
  </div>
</div>
