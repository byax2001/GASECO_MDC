
<app-header-page [PageName]="'Clientes'" />
@if(!loading()){
  <SpinnerLoad/>
}@else{
<app-search-debounce (searchEmisor)="onSearch($event)" />
<div class="flex justify-end mt-2">
  <button-icon
    class="mb-2 w-full md:w-auto"
    [funcion]="() => descargarExcel()"
    tooltip="Exportar a Excel"
    icon="fa-solid fa-file-excel"
  />
</div>
<app-table-clientes [lclientes]="clientesFiltrados()" />
}
