<modalg #modalG/>

<app-header-page
  PageName="Reporte de Ventas Moleculas"
/>

<FiltroFechaIF
  (rangoFechas)="search($event)"
/>
<button-icon
  [funcion]="() => descargarExcel()"
  [tooltip]="'Descargar Excel'"
  [icon]="'fa-solid fa-download'"/>

<div class="container mt-4">
  @if(loading()){
    <SpinnerLoad/>
  }@else{
    <TableMoleculasRV
      [ventasMoleculas]="ventasMoleculas()"
      />
  }
</div>

<!-- VELOCIMETRO TOTAL-->
<div>
<velocimetro
  [variable1]="ventasMoleculas().slice(0,-1).reduce((acc, fila) => acc + fila.Calculated_Venta, 0)"
  [variable2]="ventasMoleculas().slice(0,-1).reduce((acc, fila) => acc + fila.Calculated_PPTO, 0)"
  [nameVariable1]="'Ventas'"
  [nameVariable2]="'PPTO'"
  [symbolvariable1]="'Q'"
  [symbolvariable2]="'Q'"
  [nameVelocimetro]="'Ventas vs PPTO'"
  />
</div>

<!--Velocimetro individual-->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    @for (ventasMolecula of ventasMoleculas(); track $index) {
        @if($index < ventasMoleculas().length - 1){
            <velocimetro
                [variable1]="ventasMolecula.Calculated_Venta"
                [variable2]="ventasMolecula.Calculated_PPTO"
                [nameVariable1]="'Ventas'"
                [nameVariable2]="'PPTO'"
                [symbolvariable1]="'Q'"
                [symbolvariable2]="'Q'"
                [nameVelocimetro]="ventasMolecula.UDCodes_CodeDesc"
            />
        }
    }
</div>
