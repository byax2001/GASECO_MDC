<app-header-page [PageName]="'Escaneo de Cilindros'" />
<modalg #modalG/>
<modalact #modalAct (ynAction)="limpiarCilindros()"/>
<div class="container justify-content justify-center w-full">
   <div class="grid grid-cols-3 w-full place-items-center px-4 mb-2">
        <div class="col-span-1"></div>
        <div class="col-span-3 md:col-span-1 w-full">
            <input
            #txtCilindro
            [value]="cilindro()"
            (keyup)="cilindro.set(txtCilindro.value)"
            type="text"
            placeholder="Escanee el cilindro"
            class="input input-bordered w-full h-16 text-2xl text-center
                    bg-[#8c8c8c] text-white placeholder:text-gray-200
                    rounded-2xl shadow-lg border-gray-300
                    focus:outline-none focus:ring-4 focus:ring-[#A6C441]/40
                    focus:border-[#A6C441]"
            />
        </div>
        
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 w-full place-items-center px-4 mb-2">
        <div class= "col-span-1 md:col-span-2 text-right w-full py-2 bold text-lg rounded-l-2xl">
            No. Cilindros: {{ cilindrosEscaneados().length }}
        </div>
        <div class="flex justify-end md:justify-center w-full ">
            <button-icon
                class=" "
                [funcion]="() => modalAct.showModalAct('Limpiar Escaneo', '¿Está seguro que desea limpiar el escaneo de cilindros?')"
                tooltip="Limpiar Escaneo"
                icon="fa-solid fa-rotate-right"/>
        </div>
    </div>

    <div class="flex justify-end">
        <button-icon
            class="mb-2 w-full md:w-auto"
            [funcion]="() => descargarExcel()"
            tooltip="Exportar a Excel"
            icon="fa-solid fa-file-excel"
        />
    </div>
    <tabla-cilindros-esc [lcilindros]="cilindrosEscaneados()" (deleteLine)="removeLinea($event)"/>    
</div>
