
<modalg
  #modalG/>
<div id="home" class="hero min-h-screen">
  
  <div class="hero-overlay"></div>
  <div class="absolute top-0 left-0 w-full z-50">
      <NavbarHome [companies]="companies()" />
    </div>
  <div class="hero-content text-neutral-content text-center w-full">
    <div class="w-full max-w-5xl px-4">

      <div class="mb-32 md:hidden"></div>
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 justify-items-center">
        @for(modulo of modulos(); track modulo.code) {
          <Cardg
            [Modulo] ="modulo"
            [ButtonText]="'Ingresar'"
            (Emisor)="navigateTo($event)" />
        }
      </div>

    </div>
  </div>
</div>
