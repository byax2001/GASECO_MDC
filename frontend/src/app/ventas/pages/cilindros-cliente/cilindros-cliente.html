<app-header-page [PageName]="'Cilindros del Cliente'" />
<!--
<app-search-debounce (searchEmisor)="onSearchChange($event)" />

-->
<div class="grid grid-cols-1 justify-items-center">
  <div class="stats shadow">
    <div class="stat">
      <div class="stat-title text-center">Total De Cilindros</div>
      <div class="stat-value text-center">{{ lcilindros().length }}</div>
      <div class="stat-desc text-center">{{ lcilindros()[0]?.NOMBRE_C }}</div>
    </div>
  </div>
</div>

@if (loading()) {
<SpinnerLoad />
}
<div class="w-full inline-flex justify-end">
  <button-icon
    class="mb-2 w-full md:w-auto"
    [icon]="'fa-solid fa-file-excel'"
    [tooltip]="'Exportar a Excel'"
    [funcion]="()=> descargarExcel()"
  />
</div>
<app-table-cilindros [cilindros]="lcilindros()" />
