spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
spring.datasource.modulocilindro.url=${MODULO_CIL_URL}
spring.datasource.modulocilindro.username=${MODULO_CIL_USER}
spring.datasource.modulocilindro.password=${MODULO_CIL_PASS}
spring.datasource.modulocilindro.driver-class-name=oracle.jdbc.OracleDriver

# Parámetros Hikari específicos para este módulo:
spring.datasource.modulocilindro.hikari.maximum-pool-size=4
spring.datasource.modulocilindro.hikari.minimum-idle=2
spring.datasource.modulocilindro.hikari.idle-timeout=180000

spring.datasource.seguridad.url=${SEGURIDAD_URL}
spring.datasource.seguridad.username=${SEGURIDAD_USER}
spring.datasource.seguridad.password=${SEGURIDAD_PASS}
spring.datasource.seguridad.driver-class-name=oracle.jdbc.OracleDriver
# Parámetros Hikari específicos para Seguridad:
spring.datasource.seguridad.hikari.maximum-pool-size=1
spring.datasource.seguridad.hikari.minimum-idle=1
spring.datasource.seguridad.hikari.idle-timeout=180000

server.port=${SERVER_PORT:8087}


spring.mail.host=smtp.dreamhost.com
spring.mail.port=587
spring.mail.username=${EMAIL_EMISOR}
spring.mail.password=${EMAIL_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

